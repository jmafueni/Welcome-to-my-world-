    // ========================================================================
    // 2. SYNTHÉTISEUR AUDIO WEB (BOUCLES SONORES INTERACTIVES)
    // ========================================================================
    class StudioLoopSynthesizer {
      constructor() {
        this.ctx = null;
        this.timerId = null;
        this.isPlaying = false;
        this.step = 0;
      }
      start(preset) {
        this.stop();
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        if (!AudioCtx) return;
        this.ctx = new AudioCtx();
        this.isPlaying = true;
        this.step = 0;
        const tempoMs =
          preset === "SUB_808_DARK" || preset === "FAST_HIHAT_TRAP" || preset === "ICY_SYNTH_TRAP"
            ? 185
            : preset === "RUMBA_GUITAR" || preset === "AFRO_MELODIC"
            ? 210
            : preset === "THRILLER_FUNK"
            ? 200
            : 250;
        const tick = () => {
          if (!this.isPlaying || !this.ctx) return;
          this.triggerStep(this.ctx, preset, this.step);
          this.step = (this.step + 1) % 16;
        };
        tick();
        this.timerId = window.setInterval(tick, tempoMs);
      }
      triggerStep(ctx, preset, step) {
        const now = ctx.currentTime;
        if (preset === "HARP_STRINGS") {
          const harpNotes = [293.66, 349.23, 440.0, 523.25, 587.33, 440.0, 349.23, 293.66];
          this.playPluck(ctx, harpNotes[step % harpNotes.length], now, 0.55, "triangle", 0.14);
          if (step % 8 === 0) {
            this.playPad(ctx, 146.83, now, 1.7, 0.07);
          }
        } else if (
          preset === "SUB_808_DARK" ||
          preset === "ICY_SYNTH_TRAP" ||
          preset === "FAST_HIHAT_TRAP"
        ) {
          if (step === 0 || step === 3 || step === 6 || step === 10 || step === 12) {
            this.play808(ctx, step === 10 ? 58.27 : 51.91, now);
          }
          if (step % 2 === 0) {
            const bellNotes =
              preset === "ICY_SYNTH_TRAP"
                ? [523.25, 622.25, 587.33, 466.16]
                : [311.13, 293.66, 261.63, 246.94];
            this.playPluck(ctx, bellNotes[(step / 2) % bellNotes.length], now, 0.25, "sine", 0.07);
          }
        } else if (preset === "RUMBA_GUITAR" || preset === "AFRO_MELODIC") {
          const rumbaNotes = [329.63, 392.0, 493.88, 587.33, 659.25, 493.88, 392.0, 440.0];
          this.playPluck(ctx, rumbaNotes[step % rumbaNotes.length], now, 0.42, "triangle", 0.15);
          if (step % 4 === 0) {
            this.playPluck(ctx, 164.81, now, 0.48, "sine", 0.11);
          }
        } else if (preset === "THRILLER_FUNK" || preset === "WESTCOAST_PULSE") {
          const bassLine = [138.59, 138.59, 164.81, 185.0, 207.65, 185.0, 164.81, 146.83];
          this.playPluck(ctx, bassLine[step % bassLine.length], now, 0.28, "sawtooth", 0.1);
        } else if (
          preset === "NOCTURNE_JAZZ" ||
          preset === "MIDNIGHT_VAPOR" ||
          preset === "TWILIGHT_PAD"
        ) {
          const jazzNotes = [261.63, 311.13, 392.0, 466.16, 523.25, 466.16, 392.0, 311.13];
          this.playPluck(ctx, jazzNotes[step % jazzNotes.length], now, 0.55, "sine", 0.12);
          if (step % 8 === 0) {
            this.playPad(ctx, 130.81, now, 1.9, 0.08);
          }
        } else {
          const scale = [261.63, 311.13, 392.0, 466.16, 523.25, 392.0, 311.13, 293.66];
          this.playPluck(ctx, scale[step % scale.length], now, 0.48, "triangle", 0.12);
        }
      }
      playPluck(ctx, freq, time, duration, type, gainPeak) {
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(freq, time);
        gain.gain.setValueAtTime(0.001, time);
        gain.gain.exponentialRampToValueAtTime(gainPeak, time + 0.02);
        gain.gain.exponentialRampToValueAtTime(0.0008, time + duration);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start(time);
        osc.stop(time + duration + 0.02);
      }
      playPad(ctx, freq, time, duration, gainPeak) {
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = "sine";
        osc.frequency.setValueAtTime(freq, time);
        gain.gain.setValueAtTime(0.001, time);
        gain.gain.linearRampToValueAtTime(gainPeak, time + 0.28);
        gain.gain.exponentialRampToValueAtTime(0.0008, time + duration);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start(time);
        osc.stop(time + duration + 0.05);
      }
      play808(ctx, freq, time) {
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = "sine";
        osc.frequency.setValueAtTime(freq * 2.1, time);
        osc.frequency.exponentialRampToValueAtTime(freq, time + 0.07);
        gain.gain.setValueAtTime(0.001, time);
        gain.gain.linearRampToValueAtTime(0.28, time + 0.015);
        gain.gain.exponentialRampToValueAtTime(0.001, time + 0.48);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start(time);
        osc.stop(time + 0.5);
      }
      stop() {
        this.isPlaying = false;
        if (this.timerId !== null) {
          window.clearInterval(this.timerId);
          this.timerId = null;
        }
        if (this.ctx) {
          this.ctx.close().catch(() => {});
          this.ctx = null;
        }
      }
    }

                          {selectedAlbum.editorial}
                        </p>
                        <div className="mt-4 pt-3 border-t border-white/[0.08] flex flex-wrap items-center gap-3">
                          <button
                            onClick={() => togglePlayAlbum(selectedAlbum)}
                            className="px-3.5 py-1.5 rounded-full bg-[#C85A32] hover:bg-[#C85A32]/90 text-[#F4F1EA] font-mono text-xs uppercase tracking-wider transition-all"
                          >
                            {isSelectedPlaying ? "■ Arrêter la Platine" : "▶ Écouter l'Extrait"}
                          </button>
                          <span className="font-mono text-[11px] text-[#9E9EA9]">
                            {selectedAlbum.audioDescription}
                          </span>
                        </div>
                      </div>
                    </div>

                    {/* Liste des disques de la fréquence active */}
                    <div className="space-y-2.5">
                      {filteredAlbums.map((album) => {
                        const isPlaying = playingAlbumId === album.id;
                        return (
                          <div
                            key={album.id}
                            onClick={() => setSelectedAlbum(album)}
                            className={`spring-row cursor-pointer p-3.5 rounded-xl border flex items-center justify-between gap-4 ${
                              selectedAlbum.id === album.id
                                ? "bg-[#1E1E24] border-[#C85A32]/60"
                                : "bg-[#0B0B0C]/60 border-white/[0.06] hover:border-white/15"
                            }`}
                          >
                            <div className="flex items-center gap-3.5 min-w-0">
                              <img
                                src={album.coverImage}
                                onError={(e) => { e.currentTarget.src = album.fallbackCoverSvg; }}
                                alt={album.title}
                                className="w-12 h-12 rounded-lg object-cover border border-white/10 shrink-0"
                              />
                              <div className="min-w-0">
                                <div className="text-sm font-medium text-[#F4F1EA] truncate">
                                  <span className="font-mono text-xs text-[#C85A32] mr-2">✦</span>
                                  {album.artist} – <em className="font-serif text-lg text-[#D4AF37]">{album.title}</em>
                                </div>
                                <p className="text-xs text-[#9E9EA9] mt-0.5 line-clamp-2">{album.editorial}</p>
                              </div>
                            </div>
                            <button
                              onClick={(e) => {
                                e.stopPropagation();
                                togglePlayAlbum(album);
                              }}
                              className={`px-3 py-1 rounded-full border font-mono text-[10px] uppercase tracking-wider shrink-0 transition-colors ${
                                isPlaying
                                  ? "bg-[#C85A32] border-[#C85A32] text-[#F4F1EA]"
                                  : "bg-[#141417] border-white/10 text-[#D4AF37] hover:text-[#F4F1EA]"
                              }`}
                            >
                              {isPlaying ? "En rotation" : "Tourner"}
                            </button>
                          </div>
                        );
                      })}
                    </div>
                  </div>
                </section>
              )}

              {/* PILIER 2 : LE PANTHÉON MANGA */}
              {(activeFilter === "ALL" || activeFilter === "MANGA") && (
                <section
                  onMouseEnter={() => setHoveredTileId("MANGA")}
                  onMouseLeave={() => setHoveredTileId(null)}
                  className={`${
                    activeFilter === "MANGA" ? "col-span-12" : "col-span-12 lg:col-span-6"
                  } spring-card rounded-2xl bg-[#141417] border border-white/[0.08] hover:border-[#D4AF37]/50 p-6 sm:p-8 flex flex-col justify-between ${getTileFocusClass("MANGA")}`}
                >
                  <div>
                    <div className="flex items-center justify-between gap-2 mb-4">
                      <span className="font-mono text-xs uppercase tracking-[0.14em] text-[#D4AF37]">
                        [LE PANTHÉON MANGA // FRESQUES D'ENCRE & PHILOSOPHIE]
                      </span>
                      <button
                        onClick={() => setDrawerMode({ type: "MANGA", initialManga: MANGA_CRUCIBLE_DATA[0] })}
                        className="font-mono text-xs text-[#9E9EA9] hover:text-[#F4F1EA] bg-[#1E1E24] px-3 py-1.5 rounded-full border border-white/[0.08] transition-colors"
                      >
                        Explorer le Panthéon Complet ↗
                      </button>
                    </div>

                    <h2 className="font-serif text-4xl text-[#F4F1EA] mb-3">
                      Le Panthéon Manga
                    </h2>
                    <blockquote className="text-sm sm:text-base text-[#9E9EA9] italic border-l-2 border-[#D4AF37] pl-4 mb-6">
                      « Du premier Kaméhaméha de l'enfance au serment de Thorfinn : "Je n'ai aucun ennemi." Le véritable combat ne se livre jamais contre autrui, mais face à soi-même. »
                    </blockquote>

                    {/* Triptyque d'ouverture sur le canevas principal */}
                    <div className="space-y-3.5 mb-6">
                      {featuredManga.map((manga) => (
                        <article
                          key={manga.id}
                          onClick={() => setDrawerMode({ type: "MANGA", initialManga: manga })}
                          className="manga-card spring-row cursor-pointer rounded-xl bg-[#0B0B0C] border border-white/[0.1] hover:border-[#F4F1EA]/40 p-4 flex flex-col sm:flex-row items-start sm:items-center gap-4"
                        >
                          <div className="w-full sm:w-28 h-24 rounded-lg border border-white/10 overflow-hidden shrink-0 bg-[#141417]">
                            <img
                              src={manga.artworkUrl}
                              onError={(e) => { e.currentTarget.src = manga.fallbackArtworkSvg; }}
                              alt={manga.title}
                              className="manga-ink-img w-full h-full object-cover"
                            />
                          </div>
                          <div className="flex-1 min-w-0">
                            <div className="flex flex-wrap items-center justify-between gap-2 mb-1">
                              <span className="px-2 py-0.5 rounded bg-[#F4F1EA] text-[#0B0B0C] font-mono text-[10px] font-bold">
                                {manga.kanjiMotif}
                              </span>
                              <span className="font-mono text-xs text-[#D4AF37]">{manga.author}</span>
                            </div>
                            <h3 className="font-serif text-2xl text-[#F4F1EA]">{manga.title}</h3>
                            <p className="text-sm text-[#F4F1EA]/85 mt-1 leading-relaxed">{manga.editorial}</p>
                          </div>
                        </article>
                      ))}
                    </div>

                    {/* Galerie étendue avec aperçus visuels directs */}
                    <div className="rounded-xl bg-[#0B0B0C]/80 border border-white/[0.08] p-4">
                      <div className="flex items-center justify-between mb-3">
                        <span className="font-mono text-xs uppercase text-[#9E9EA9]">
                          PILIERS NARRATIFS & DUELS STRATÉGIQUES (CLIQUER POUR LIRE)
                        </span>
                        <span className="font-mono text-[11px] text-[#C85A32]">
                          GALERIE D'ENCRE
                        </span>
                      </div>
                      <div className="grid grid-cols-1 sm:grid-cols-2 gap-2.5">
                        {archiveManga.map((work) => (
                          <button
                            key={work.id}
                            onClick={() => setDrawerMode({ type: "MANGA", initialManga: work })}
                            className="manga-card p-2.5 rounded-lg bg-[#141417] hover:bg-[#1E1E24] border border-white/[0.08] hover:border-[#D4AF37]/50 text-left flex items-center gap-3 transition-all"
                          >
                            <img
                              src={work.artworkUrl}
                              onError={(e) => { e.currentTarget.src = work.fallbackArtworkSvg; }}
                              alt={work.title}
                              className="manga-ink-img w-12 h-12 rounded object-cover border border-white/10 shrink-0"
                            />
                            <div className="min-w-0">
                              <div className="font-serif text-base text-[#F4F1EA] truncate">{work.title}</div>
                              <div className="font-mono text-[10px] text-[#9E9EA9] truncate">{work.author} • {work.kanjiMotif}</div>
                            </div>
                          </button>
                        ))}
                      </div>
                    </div>
                  </div>
                </section>
              )}

              {/* PILIER 3 : LE TERRAIN (ÂGE D'OR DU FOOTBALL 1990–2010) */}
              {(activeFilter === "ALL" || activeFilter === "FOOTBALL") && (
                <section
                  onMouseEnter={() => setHoveredTileId("FOOTBALL")}
                  onMouseLeave={() => setHoveredTileId(null)}
                  className={`col-span-12 spring-card rounded-2xl bg-[#141417] border border-white/[0.08] hover:border-[#D4AF37]/50 p-6 sm:p-8 ${getTileFocusClass("FOOTBALL")}`}
                >
                  <div className="flex flex-col lg:flex-row lg:items-end justify-between gap-6 mb-8 pb-6 border-b border-white/[0.08]">
                    <div>
                      <span className="font-mono text-xs uppercase tracking-[0.14em] text-[#D4AF37] block mb-2">
                        [LE TERRAIN • ARCHIVE DE L'ÂGE D'OR 1990–2010]
                      </span>
                      <h2 className="font-serif text-4xl text-[#F4F1EA] mb-3">
                        Le Terrain
                      </h2>
                      <blockquote className="text-sm sm:text-base text-[#9E9EA9] italic border-l-2 border-[#D4AF37] pl-4 max-w-3xl">
                        « Les résumés célèbrent les buteurs ; mais ce sont la rigueur tactique, les sentinelles infatigables et les charnières impériales qui bâtissent les dynasties. »
                      </blockquote>
                    </div>

                    <div className="flex flex-wrap items-center gap-3">
                      <div className="px-3.5 py-2 rounded-xl bg-[#0B0B0C] border border-white/[0.08] font-mono text-xs text-[#F4F1EA]">
                        <span className="text-[#9E9EA9] block text-[10px]">
                          DOUBLE ALLÉGEANCE
                        </span>
                        PARIS SAINT-GERMAIN × MANCHESTER UNITED
                      </div>
                      <button
                        onClick={() => setDrawerMode({ type: "FOOTBALL", initialCard: FOOTBALL_LEGACY_DATA[0] })}
                        className="font-mono text-xs text-[#F4F1EA] bg-[#1E1E24] hover:bg-[#C85A32] px-4 py-3 rounded-xl border border-white/[0.08] transition-colors"
                      >
                        Ouvrir le Dossier Tactique ↗
                      </button>
                    </div>
                  </div>

                  <div className="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-4 gap-5">
                    {FOOTBALL_LEGACY_DATA.map((card) => (
                      <article
                        key={card.id}
                        onClick={() => setDrawerMode({ type: "FOOTBALL", initialCard: card })}
                        className="spring-card cursor-pointer rounded-xl bg-[#0B0B0C] border border-[#D4AF37]/25 hover:border-[#D4AF37] p-5 flex flex-col justify-between transition-all"
                      >
                        <div>
                          <div className="flex items-center justify-between gap-2 pb-2 mb-3 border-b border-white/[0.08]">
                            <span className="font-mono text-[10px] tracking-widest uppercase text-[#D4AF37]">
                              {card.tag}
                            </span>
                            <span className="font-mono text-[10px] px-2 py-0.5 rounded bg-[#141417] text-[#9E9EA9]">
                              {card.era}
                            </span>
                          </div>
                          <h3 className="font-serif text-2xl text-[#F4F1EA] mb-1">{card.title}</h3>
                          <p className="font-mono text-[11px] text-[#C85A32] mb-3">{card.subtitle}</p>
                          <p className="text-sm text-[#F4F1EA]/90 leading-relaxed">{card.editorial}</p>
                        </div>
                        <div className="mt-5 pt-3 border-t border-white/[0.06] font-mono text-[10px] text-[#9E9EA9] flex justify-between">
                          <span>{card.tacticalRole}</span>
                          <span className="text-[#D4AF37]">DOSSIER →</span>
                        </div>
                      </article>
                    ))}
                  </div>
                </section>
              )}
            </div>
          </main>

          {/* TIROIR ÉDITORIAL LATÉRAL (SLIDE-OVER) */}
          {drawerMode && (
            <div className="fixed inset-0 z-50 flex justify-end">
              <div
                onClick={() => setDrawerMode(null)}
                className="fixed inset-0 bg-black/75 backdrop-blur-sm"
              />
              <aside
                role="dialog"
                aria-modal="true"
                className="drawer-slide-in relative z-10 w-full max-w-2xl bg-[#141417] border-l border-white/[0.12] h-full overflow-y-auto p-6 sm:p-10"
              >
                <div className="sticky top-0 z-20 -mx-6 sm:-mx-10 -mt-6 sm:-mt-10 px-6 sm:px-10 py-5 bg-[#141417]/95 backdrop-blur-md flex items-center justify-between mb-6 border-b border-white/[0.08]">
                  <div>
                    <span className="font-mono text-xs uppercase text-[#C85A32]">
                      ARCHIVE ÉDITORIALE INTÉGRALE // SANS CLASSEMENT NI HIÉRARCHIE
                    </span>
                    <h3 className="font-serif text-3xl text-[#F4F1EA]">
                      {drawerMode.type === "MUSIC" && "La Sonothèque — Collection Intégrale"}
                      {drawerMode.type === "MANGA" && "Le Panthéon Manga — Fresques & Récits"}
                      {drawerMode.type === "FOOTBALL" && "Le Terrain — Âge d'Or 1990–2010"}
                    </h3>
                  </div>
                  <button
                    onClick={() => setDrawerMode(null)}
                    className="px-3.5 py-1.5 rounded-full bg-[#1E1E24] hover:bg-[#C85A32] font-mono text-xs text-[#F4F1EA] border border-white/[0.1] transition-colors"
                  >
                    FERMER [✕]
                  </button>
                </div>

                {drawerMode.type === "MUSIC" && (
                  <div className="space-y-8">
                    {MUSIC_CATEGORIES.map((category) => (
                      <div key={category.key} className="space-y-3">
                        <h4 className="font-mono text-xs uppercase tracking-[0.15em] text-[#D4AF37] border-b border-white/[0.08] pb-2">
                          {category.fullTitle}
                        </h4>
                        {SOUND_SPECTRUM_DATA.filter((r) => r.category === category.key).map((rec) => {
                          const isPlaying = playingAlbumId === rec.id;
                          return (
                            <div
                              key={rec.id}
                              className={`p-4 rounded-xl border flex flex-col sm:flex-row gap-4 ${
                                drawerMode.initialAlbum?.id === rec.id
                                  ? "bg-[#1E1E24] border-[#C85A32]"
                                  : "bg-[#0B0B0C] border-white/[0.08]"
                              }`}
                            >
                              <img
                                src={rec.coverImage}
                                onError={(e) => { e.currentTarget.src = rec.fallbackCoverSvg; }}
                                alt={rec.title}
                                className="w-20 h-20 rounded-lg object-cover border border-white/10 shrink-0"
                              />
                              <div className="flex-1">
                                <div className="flex flex-wrap items-center justify-between gap-2 mb-1">
                                  <div className="font-serif text-xl text-[#F4F1EA]">
                                    {rec.artist} – <em className="text-[#D4AF37]">{rec.title}</em>
                                  </div>
                                  <span className="font-mono text-[10px] text-[#9E9EA9]">
                                    {rec.origin} // {rec.rpm}
                                  </span>
                                </div>
                                <p className="text-sm text-[#F4F1EA]/85 mt-1 mb-3 leading-relaxed">{rec.editorial}</p>
                                <button
                                  onClick={() => togglePlayAlbum(rec)}
                                  className="px-3 py-1 rounded-full bg-[#141417] hover:bg-[#C85A32] border border-white/15 font-mono text-[11px] text-[#D4AF37] hover:text-[#F4F1EA] transition-colors"
                                >
                                  {isPlaying ? "■ Arrêter la Boucle" : `▶ Écouter (${rec.audioDescription})`}
                                </button>
                              </div>
                            </div>
                          );
                        })}
                      </div>
                    ))}
                  </div>
                )}

                {drawerMode.type === "MANGA" && (
                  <div className="space-y-4">
                    {MANGA_CRUCIBLE_DATA.map((work) => (
                      <div
                        key={work.id}
                        className={`p-4 rounded-xl border flex flex-col sm:flex-row gap-4 ${
                          drawerMode.initialManga?.id === work.id
                            ? "bg-[#1E1E24] border-[#D4AF37]"
                            : "bg-[#0B0B0C] border-white/[0.08]"
                        }`}
                      >
                        <img
                          src={work.artworkUrl}
                          onError={(e) => { e.currentTarget.src = work.fallbackArtworkSvg; }}
                          alt={work.title}
                          className="manga-ink-img w-full sm:w-28 h-24 rounded-lg object-cover border border-white/10 shrink-0"
                        />
                        <div>
                          <div className="font-serif text-xl text-[#F4F1EA]">
                            <em>{work.title}</em> ({work.author}) — <span className="font-mono text-xs text-[#D4AF37]">{work.kanjiMotif}</span>
                          </div>
                          <div className="font-mono text-[10px] text-[#9E9EA9] mt-0.5">{work.categoryLabel}</div>
                          <p className="text-sm text-[#F4F1EA]/85 mt-1.5 leading-relaxed">{work.editorial}</p>
                        </div>
                      </div>
                    ))}
                  </div>
                )}

                {drawerMode.type === "FOOTBALL" && (
                  <div className="space-y-4">
                    {FOOTBALL_LEGACY_DATA.map((card) => (
                      <div
                        key={card.id}
                        className={`p-5 rounded-xl border ${
                          drawerMode.initialCard?.id === card.id
                            ? "bg-[#1E1E24] border-[#D4AF37]"
                            : "bg-[#0B0B0C] border-white/[0.08]"
                        }`}
                      >
                        <div className="font-mono text-[11px] text-[#D4AF37] mb-1">
                          {card.tag} // {card.era}
                        </div>
                        <div className="font-serif text-2xl text-[#F4F1EA]">{card.title}</div>
                        <div className="font-mono text-xs text-[#C85A32] mt-0.5 mb-2">{card.subtitle}</div>
                        <p className="text-sm text-[#F4F1EA]/90 leading-relaxed">{card.editorial}</p>
                      </div>
                    ))}
                  </div>
                )}
              </aside>
            </div>
          )}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
