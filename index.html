    // ========================================================================
    // 2. SYNTHÉTISEUR AUDIO WEB (BOUCLES MUSICALES PAR DISQUE)
    // ========================================================================
    class StudioLoopSynthesizer {
      constructor() {
        this.ctx = null;
        this.timerId = null;
        this.isPlaying = false;
        this.step = 0;
      }
      start(preset) {
        this.stop();
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        if (!AudioCtx) return;
        this.ctx = new AudioCtx();
        this.isPlaying = true;
        this.step = 0;
        const tempoMs =
          preset === "SUB_808_DARK" || preset === "FAST_HIHAT_TRAP" || preset === "ICY_SYNTH_TRAP"
            ? 180
            : preset === "RUMBA_GUITAR" || preset === "AFRO_MELODIC"
            ? 205
            : preset === "THRILLER_FUNK"
            ? 195
            : 245;
        const tick = () => {
          if (!this.isPlaying || !this.ctx) return;
          this.triggerStep(this.ctx, preset, this.step);
          this.step = (this.step + 1) % 16;
        };
        tick();
        this.timerId = window.setInterval(tick, tempoMs);
      }
      triggerStep(ctx, preset, step) {
        const now = ctx.currentTime;
        if (preset === "HARP_STRINGS") {
          const harpNotes = [293.66, 349.23, 440.0, 523.25, 587.33, 440.0, 349.23, 293.66];
          this.playPluck(ctx, harpNotes[step % harpNotes.length], now, 0.55, "triangle", 0.14);
          if (step % 8 === 0) {
            this.playPad(ctx, 146.83, now, 1.7, 0.08);
          }
        } else if (
          preset === "SUB_808_DARK" ||
          preset === "ICY_SYNTH_TRAP" ||
          preset === "FAST_HIHAT_TRAP"
        ) {
          if (step === 0 || step === 3 || step === 6 || step === 10 || step === 12) {
            this.play808(ctx, step === 10 ? 58.27 : 51.91, now);
          }
          if (step % 2 === 0) {
            const bellNotes =
              preset === "ICY_SYNTH_TRAP"
                ? [523.25, 622.25, 587.33, 466.16]
                : [311.13, 293.66, 261.63, 246.94];
            this.playPluck(ctx, bellNotes[(step / 2) % bellNotes.length], now, 0.25, "sine", 0.07);
          }
        } else if (preset === "RUMBA_GUITAR" || preset === "AFRO_MELODIC") {
          const rumbaNotes = [329.63, 392.0, 493.88, 587.33, 659.25, 493.88, 392.0, 440.0];
          this.playPluck(ctx, rumbaNotes[step % rumbaNotes.length], now, 0.42, "triangle", 0.15);
          if (step % 4 === 0) {
            this.playPluck(ctx, 164.81, now, 0.48, "sine", 0.12);
          }
        } else if (preset === "THRILLER_FUNK" || preset === "WESTCOAST_PULSE") {
          const bassLine = [138.59, 138.59, 164.81, 185.0, 207.65, 185.0, 164.81, 146.83];
          this.playPluck(ctx, bassLine[step % bassLine.length], now, 0.28, "sawtooth", 0.11);
        } else {
          const scale = [261.63, 311.13, 392.0, 466.16, 523.25, 392.0, 311.13, 293.66];
          this.playPluck(ctx, scale[step % scale.length], now, 0.48, "sine", 0.12);
        }
      }
      playPluck(ctx, freq, time, duration, type, gainPeak) {
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(freq, time);
        gain.gain.setValueAtTime(0.001, time);
        gain.gain.exponentialRampToValueAtTime(gainPeak, time + 0.02);
        gain.gain.exponentialRampToValueAtTime(0.0008, time + duration);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start(time);
        osc.stop(time + duration + 0.02);
      }
      playPad(ctx, freq, time, duration, gainPeak) {
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = "sine";
        osc.frequency.setValueAtTime(freq, time);
        gain.gain.setValueAtTime(0.001, time);
        gain.gain.linearRampToValueAtTime(gainPeak, time + 0.28);
        gain.gain.exponentialRampToValueAtTime(0.0008, time + duration);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start(time);
        osc.stop(time + duration + 0.05);
      }
      play808(ctx, freq, time) {
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = "sine";
        osc.frequency.setValueAtTime(freq * 2.1, time);
        osc.frequency.exponentialRampToValueAtTime(freq, time + 0.07);
        gain.gain.setValueAtTime(0.001, time);
        gain.gain.linearRampToValueAtTime(0.28, time + 0.015);
        gain.gain.exponentialRampToValueAtTime(0.001, time + 0.48);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start(time);
        osc.stop(time + 0.5);
      }
      stop() {
        this.isPlaying = false;
        if (this.timerId !== null) {
          window.clearInterval(this.timerId);
          this.timerId = null;
        }
        if (this.ctx) {
          this.ctx.close().catch(() => {});
          this.ctx = null;
        }
      }
    }

    // ========================================================================
    // 3. ARRIÈRE-PLAN CANVAS VIVANT (PARTICULES & HALOS LUMINEUX RÉACTIFS)
    // ========================================================================
    function LivingAmbientCanvas({ isAudioActive }) {
      const canvasRef = useRef(null);
      const activeRef = useRef(isAudioActive);

      useEffect(() => {
        activeRef.current = isAudioActive;
      }, [isAudioActive]);

      useEffect(() => {
        const canvas = canvasRef.current;
        if (!canvas) return;
        const ctx = canvas.getContext("2d");
        if (!ctx) return;

        let animId;
        let width = (canvas.width = window.innerWidth);
        let height = (canvas.height = window.innerHeight);

        const handleResize = () => {
          if (!canvas) return;
          width = canvas.width = window.innerWidth;
          height = canvas.height = window.innerHeight;
        };
        window.addEventListener("resize", handleResize);

        const palette = ["#C85A32", "#D4AF37", "#F4F1EA"];
        const particles = Array.from({ length: 46 }, (_, idx) => ({
          x: Math.random() * width,
          y: Math.random() * height,
          r: 1.2 + Math.random() * 2.8,
          vx: (Math.random() - 0.5) * 0.35,
          vy: -0.18 - Math.random() * 0.42,
          alpha: 0.16 + Math.random() * 0.45,
          color: palette[idx % palette.length],
          phase: Math.random() * Math.PI * 2,
        }));

        let tick = 0;
        const render = () => {
          tick += activeRef.current ? 0.032 : 0.012;
          ctx.clearRect(0, 0, width, height);

          // Gradients radiaux flottants (Terracotta & Or Trophée)
          const orb1X = width * (0.25 + Math.sin(tick * 0.7) * 0.12);
          const orb1Y = height * (0.22 + Math.cos(tick * 0.5) * 0.1);
          const grad1 = ctx.createRadialGradient(orb1X, orb1Y, 10, orb1X, orb1Y, Math.max(width, height) * 0.45);
          grad1.addColorStop(0, activeRef.current ? "rgba(200, 90, 50, 0.16)" : "rgba(200, 90, 50, 0.09)");
          grad1.addColorStop(1, "rgba(11, 11, 12, 0)");
          ctx.fillStyle = grad1;
          ctx.fillRect(0, 0, width, height);

          const orb2X = width * (0.75 + Math.cos(tick * 0.6) * 0.12);
          const orb2Y = height * (0.68 + Math.sin(tick * 0.4) * 0.12);
          const grad2 = ctx.createRadialGradient(orb2X, orb2Y, 10, orb2X, orb2Y, Math.max(width, height) * 0.42);
          grad2.addColorStop(0, activeRef.current ? "rgba(212, 175, 55, 0.13)" : "rgba(212, 175, 55, 0.07)");
          grad2.addColorStop(1, "rgba(11, 11, 12, 0)");
          ctx.fillStyle = grad2;
          ctx.fillRect(0, 0, width, height);

          // Particules lumineuses flottantes
          const speedMult = activeRef.current ? 2.1 : 1.0;
          for (const p of particles) {
            p.x += p.vx * speedMult + Math.sin(tick + p.phase) * 0.18;
            p.y += p.vy * speedMult;

            if (p.y < -12) p.y = height + 12;
            if (p.x < -12) p.x = width + 12;
            if (p.x > width + 12) p.x = -12;

            const pulseAlpha = p.alpha * (0.75 + 0.25 * Math.sin(tick * 2 + p.phase));
            ctx.save();
            ctx.globalAlpha = pulseAlpha;
            ctx.fillStyle = p.color;
            ctx.shadowColor = p.color;
            ctx.shadowBlur = activeRef.current ? 14 : 8;
            ctx.beginPath();
            ctx.arc(p.x, p.y, activeRef.current ? p.r * 1.25 : p.r, 0, Math.PI * 2);
            ctx.fill();
            ctx.restore();
          }

          animId = window.requestAnimationFrame(render);
        };

        render();
        return () => {
          window.removeEventListener("resize", handleResize);
          window.cancelAnimationFrame(animId);
        };
      }, []);

      return (
        <canvas
          ref={canvasRef}
          aria-hidden="true"
          className="pointer-events-none fixed inset-0 z-0"
        />
      );
    }

    function WallpaperBackdrop({ activeWallpaperId }) {
      return (
        <div
          aria-hidden="true"
          className="pointer-events-none fixed inset-0 z-0 overflow-hidden bg-[#0B0B0C]"
        >
          {WALLPAPER_OPTIONS.map((wp) => {
            const isActive = wp.id === activeWallpaperId;
            return (
              <img
                key={wp.id}
                src={wp.url}
                onError={(e) => {
                  e.currentTarget.src = wp.fallbackSvg;
                }}
                alt={wp.label}
                style={{ filter: "brightness(0.28) contrast(1.15)" }}
                className={`absolute inset-0 w-full h-full object-cover transition-all duration-700 ease-in-out ${
                  isActive ? "opacity-100 scale-100" : "opacity-0 scale-105"
                }`}
              />
            );
          })}
          <div className="absolute inset-0 bg-gradient-to-b from-[#0B0B0C]/80 via-[#0B0B0C]/70 to-[#0B0B0C]/90" />
        </div>
      );
    }

    // 6. VISUALISEUR DE FRÉQUENCES EN TEMPS RÉEL
    // ========================================================================
    function FrequencyVisualizer({ isPlaying, accentColor }) {
      const bars = [0.35, 0.75, 0.55, 0.95, 0.45, 0.85, 0.6, 1.0, 0.5, 0.9, 0.65, 0.8, 0.4, 0.7, 0.55, 0.35];
      return (
        <div
          aria-label="Visualiseur de fréquences audio"
          className="flex items-end gap-1 h-8 px-3 py-1.5 rounded-lg bg-[#141417] border border-white/[0.08]"
        >
          {bars.map((heightRatio, index) => (
            <span
              key={index}
              className={`w-1 rounded-full transition-all duration-300 ${
                isPlaying ? "eq-bar-active" : ""
              }`}
              style={{
                height: isPlaying ? `${Math.round(heightRatio * 100)}%` : "24%",
                backgroundColor: isPlaying ? accentColor : "#9E9EA9",
                opacity: isPlaying ? 0.95 : 0.35,
                animationDelay: `${index * 0.06}s`,
                animationDuration: `${0.45 + (index % 4) * 0.14}s`,
              }}
            />
          ))}
        </div>
      );
    }

                            />
                            <div className="absolute inset-0 bg-gradient-to-t from-[#141417] via-transparent to-transparent" />
                            <span className="absolute bottom-2 left-3 px-2 py-0.5 rounded bg-[#0B0B0C]/85 text-[#D4AF37] font-mono text-[10px] border border-[#D4AF37]/30">
                              {work.kanjiMotif}
                            </span>
                          </div>
                          <div className="p-4">
                            <div className="flex items-center justify-between gap-2 mb-1">
                              <h4 className="font-serif text-2xl text-[#F4F1EA] truncate">
                                {work.title}
                              </h4>
                              <span className="font-mono text-[11px] text-[#C85A32] shrink-0">
                                {work.author}
                              </span>
                            </div>
                            <p className="text-xs text-[#F4F1EA]/85 leading-relaxed">
                              {work.editorial}
                            </p>
                          </div>
                        </article>
                      ))}
                    </div>
                  </div>
                </section>
              )}
            </div>
          </main>

          {/* ================================================================
              TIROIR ÉDITORIAL LATÉRAL (SLIDE-OVER GRAND FORMAT EN FRANÇAIS)
          ================================================================ */}
          {drawerMode && (
            <div className="fixed inset-0 z-50 flex justify-end">
              <div
                onClick={() => setDrawerMode(null)}
                className="fixed inset-0 bg-black/80 backdrop-blur-md"
              />
              <aside
                role="dialog"
                aria-modal="true"
                className="drawer-slide-in relative z-10 w-full max-w-3xl bg-[#141417] border-l border-white/[0.14] h-full overflow-y-auto p-6 sm:p-10 shadow-2xl"
              >
                <div className="sticky top-0 z-20 -mx-6 sm:-mx-10 -mt-6 sm:-mt-10 px-6 sm:px-10 py-5 bg-[#141417]/95 backdrop-blur-md flex items-center justify-between mb-8 border-b border-white/[0.08]">
                  <div>
                    <span className="font-mono text-xs uppercase tracking-[0.16em] text-[#C85A32] block">
                      {drawerMode.type === "MUSIC"
                        ? "LA SONOTHÈQUE // ARCHIVE COMPLÈTE SANS CLASSEMENT"
                        : "LE PANTHÉON MANGA // GALERIE D'AFFICHES ORIGINALES"}
                    </span>
                    <h3 className="font-serif text-3xl text-[#F4F1EA]">
                      {drawerMode.type === "MUSIC"
                        ? "Collection Vinyle & Écoute Interactive"
                        : "Les Chefs-d'Œuvre Narratifs en Pleine Couleur"}
                    </h3>
                  </div>
                  <button
                    onClick={() => setDrawerMode(null)}
                    className="px-4 py-2 rounded-full bg-[#1E1E24] hover:bg-[#C85A32] font-mono text-xs text-[#F4F1EA] border border-white/[0.12] transition-colors"
                  >
                    FERMER [✕]
                  </button>
                </div>

                {drawerMode.type === "MUSIC" && (
                  <div className="space-y-10">
                    {MUSIC_CATEGORIES.map((category) => (
                      <div key={category.key} className="space-y-4">
                        <h4 className="font-mono text-xs uppercase tracking-[0.18em] text-[#D4AF37] border-b border-white/[0.08] pb-2">
                          {category.fullTitle}
                        </h4>
                        {SOUND_SPECTRUM_DATA.filter((r) => r.category === category.key).map((rec) => {
                          const isPlaying = playingAlbumId === rec.id;
                          return (
                            <div
                              key={rec.id}
                              className={`p-5 rounded-2xl border flex flex-col sm:flex-row gap-5 items-start sm:items-center ${
                                drawerMode.initialAlbum?.id === rec.id
                                  ? "bg-[#1E1E24] border-[#C85A32]"
                                  : "bg-[#0B0B0C] border-white/[0.08]"
                              }`}
                            >
                              <img
                                src={rec.coverImage}
                                onError={(e) => {
                                  e.currentTarget.src = rec.fallbackCoverSvg;
                                }}
                                alt={rec.title}
                                className="w-28 h-28 rounded-xl object-cover border border-white/15 shrink-0 shadow-lg"
                              />
                              <div className="flex-1">
                                <div className="flex flex-wrap items-center justify-between gap-2 mb-1">
                                  <div className="font-serif text-2xl text-[#F4F1EA]">
                                    {rec.artist} — <em className="text-[#D4AF37]">{rec.title}</em>
                                  </div>
                                  <span className="font-mono text-xs text-[#9E9EA9]">
                                    {rec.origin} // {rec.rpm}
                                  </span>
                                </div>
                                <p className="text-sm text-[#F4F1EA]/90 mt-1 mb-3 leading-relaxed">
                                  {rec.editorial}
                                </p>
                                <button
                                  onClick={() => togglePlayAlbum(rec)}
                                  className={`px-4 py-1.5 rounded-full font-mono text-xs uppercase tracking-wider border transition-colors ${
                                    isPlaying
                                      ? "bg-[#C85A32] border-[#C85A32] text-[#F4F1EA]"
                                      : "bg-[#141417] border-white/15 text-[#D4AF37] hover:bg-[#C85A32] hover:text-[#F4F1EA]"
                                  }`}
                                >
                                  {isPlaying
                                    ? "■ Arrêter la Platine"
                                    : `▶ Lancer le Vinyle (${rec.audioDescription})`}
                                </button>
                              </div>
                            </div>
                          );
                        })}
                      </div>
                    ))}
                  </div>
                )}

                {drawerMode.type === "MANGA" && (
                  <div className="space-y-6">
                    {MANGA_CRUCIBLE_DATA.map((work) => (
                      <div
                        key={work.id}
                        className={`p-5 rounded-2xl border flex flex-col sm:flex-row gap-6 items-start ${
                          drawerMode.initialManga?.id === work.id
                            ? "bg-[#1E1E24] border-[#D4AF37]"
                            : "bg-[#0B0B0C] border-white/[0.08]"
                        }`}
                      >
                        <img
                          src={work.artworkUrl}
                          onError={(e) => {
                            e.currentTarget.src = work.fallbackArtworkSvg;
                          }}
                          alt={work.title}
                          className="manga-poster-img w-full sm:w-44 h-56 rounded-xl object-cover border border-white/15 shrink-0 shadow-xl"
                        />
                        <div className="flex-1">
                          <div className="flex flex-wrap items-center justify-between gap-2 mb-2">
                            <span className="px-2.5 py-1 rounded bg-[#F4F1EA] text-[#0B0B0C] font-mono text-xs font-bold">
                              {work.kanjiMotif}
                            </span>
                            <span className="font-mono text-xs text-[#D4AF37]">
                              {work.author} • {work.categoryLabel}
                            </span>
                          </div>
                          <h4 className="font-serif text-3xl text-[#F4F1EA] mb-2">
                            {work.title}
                          </h4>
                          <p className="text-base text-[#F4F1EA]/90 leading-relaxed">
                            {work.editorial}
                          </p>
                        </div>
                      </div>
                    ))}
                  </div>
                )}
              </aside>
            </div>
          )}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
