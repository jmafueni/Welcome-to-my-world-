    function LivingAmbientCanvas({ isAudioActive }) {
      const canvasRef = useRef(null);
      const activeRef = useRef(isAudioActive);

      useEffect(() => {
        activeRef.current = isAudioActive;
      }, [isAudioActive]);

      useEffect(() => {
        const canvas = canvasRef.current;
        if (!canvas) return;
        const ctx = canvas.getContext("2d");
        if (!ctx) return;

        let animId;
        let width = (canvas.width = window.innerWidth);
        let height = (canvas.height = window.innerHeight);

        const handleResize = () => {
          if (!canvas) return;
          width = canvas.width = window.innerWidth;
          height = canvas.height = window.innerHeight;
        };
        window.addEventListener("resize", handleResize);

        const palette = ["#C85A32", "#D4AF37", "#F4F1EA"];
        const particles = Array.from({ length: 46 }, (_, idx) => ({
          x: Math.random() * width,
          y: Math.random() * height,
          r: 1.2 + Math.random() * 2.8,
          vx: (Math.random() - 0.5) * 0.35,
          vy: -0.18 - Math.random() * 0.42,
          alpha: 0.16 + Math.random() * 0.45,
          color: palette[idx % palette.length],
          phase: Math.random() * Math.PI * 2,
        }));

        let tick = 0;
        const render = () => {
          tick += activeRef.current ? 0.032 : 0.012;
          ctx.clearRect(0, 0, width, height);

          const orb1X = width * (0.25 + Math.sin(tick * 0.7) * 0.12);
          const orb1Y = height * (0.22 + Math.cos(tick * 0.5) * 0.1);
          const grad1 = ctx.createRadialGradient(orb1X, orb1Y, 10, orb1X, orb1Y, Math.max(width, height) * 0.45);
          grad1.addColorStop(0, activeRef.current ? "rgba(200, 90, 50, 0.16)" : "rgba(200, 90, 50, 0.09)");
          grad1.addColorStop(1, "rgba(11, 11, 12, 0)");
          ctx.fillStyle = grad1;
          ctx.fillRect(0, 0, width, height);

          const orb2X = width * (0.75 + Math.cos(tick * 0.6) * 0.12);
          const orb2Y = height * (0.68 + Math.sin(tick * 0.4) * 0.12);
          const grad2 = ctx.createRadialGradient(orb2X, orb2Y, 10, orb2X, orb2Y, Math.max(width, height) * 0.42);
          grad2.addColorStop(0, activeRef.current ? "rgba(212, 175, 55, 0.13)" : "rgba(212, 175, 55, 0.07)");
          grad2.addColorStop(1, "rgba(11, 11, 12, 0)");
          ctx.fillStyle = grad2;
          ctx.fillRect(0, 0, width, height);

          const speedMult = activeRef.current ? 2.1 : 1.0;
          for (const p of particles) {
            p.x += p.vx * speedMult + Math.sin(tick + p.phase) * 0.18;
            p.y += p.vy * speedMult;

            if (p.y < -12) p.y = height + 12;
            if (p.x < -12) p.x = width + 12;
            if (p.x > width + 12) p.x = -12;

            const pulseAlpha = p.alpha * (0.75 + 0.25 * Math.sin(tick * 2 + p.phase));
            ctx.save();
            ctx.globalAlpha = pulseAlpha;
            ctx.fillStyle = p.color;
            ctx.shadowColor = p.color;
            ctx.shadowBlur = activeRef.current ? 14 : 8;
            ctx.beginPath();
            ctx.arc(p.x, p.y, activeRef.current ? p.r * 1.25 : p.r, 0, Math.PI * 2);
            ctx.fill();
            ctx.restore();
          }

          animId = window.requestAnimationFrame(render);
        };

        render();
        return () => {
          window.removeEventListener("resize", handleResize);
          window.cancelAnimationFrame(animId);
        };
      }, []);

      return (
        <canvas
          ref={canvasRef}
          aria-hidden="true"
          className="pointer-events-none fixed inset-0 z-0"
        />
      );
    }

    function HolographicMangaPoster({ manga, heightClass = "h-64 sm:h-72", showAuthorBadge = true }) {
      const [isHovered, setIsHovered] = useState(false);
      const [forcedMode, setForcedMode] = useState("AUTO");
      const [tilt, setTilt] = useState({ rotateX: 0, rotateY: 0, sheenX: 50 });

      const showAnimated =
        forcedMode === "ANIMATED"
          ? true
          : forcedMode === "POSTER"
          ? false
          : isHovered;

      const handleMouseMove = (e) => {
        const rect = e.currentTarget.getBoundingClientRect();
        const relX = (e.clientX - rect.left) / rect.width;
        const relY = (e.clientY - rect.top) / rect.height;
        const rotateY = (relX - 0.5) * 12;
        const rotateX = (0.5 - relY) * 10;
        const sheenX = Math.round(relX * 100);
        setTilt({ rotateX, rotateY, sheenX });
      };

      const handleMouseLeave = () => {
        setIsHovered(false);
        setTilt({ rotateX: 0, rotateY: 0, sheenX: 50 });
      };

      return (
        <div
          onMouseEnter={() => setIsHovered(true)}
          onMouseMove={handleMouseMove}
          onMouseLeave={handleMouseLeave}
          style={{
            transform: isHovered
              ? `perspective(1000px) rotateX(${tilt.rotateX.toFixed(2)}deg) rotateY(${tilt.rotateY.toFixed(2)}deg) scale(1.015)`
              : "perspective(1000px) rotateX(0deg) rotateY(0deg) scale(1)",
            transition: "transform 0.35s cubic-bezier(0.22, 1, 0.36, 1)",
          }}
          className={`group relative ${heightClass} w-full overflow-hidden bg-[#141417] select-none`}
        >
          <img
            src={manga.artworkUrl}
            onError={(e) => {
              e.currentTarget.src = manga.fallbackArtworkSvg;
            }}
            alt={manga.title}
            className={`manga-poster-img w-full h-full object-cover transition-opacity duration-500 ${
              showAnimated ? "opacity-0" : "opacity-100"
            }`}
          />

          <img
            src={manga.animationGifUrl}
            onError={(e) => {
              e.currentTarget.src = manga.artworkUrl || manga.fallbackArtworkSvg;
            }}
            alt={`${manga.title} — Scène culte animée`}
            className={`absolute inset-0 w-full h-full object-cover saturate-[1.22] contrast-[1.1] opacity-0 group-hover:opacity-100 transition-opacity duration-500 ${
              showAnimated ? "!opacity-100" : "pointer-events-none"
            }`}
          />

          <div
            aria-hidden="true"
            style={{
              background:
                "linear-gradient(105deg, transparent 40%, rgba(255,255,255,0.2) 45%, rgba(212,175,55,0.3) 50%, transparent 54%)",
              backgroundSize: "200% 200%",
              backgroundPosition: `${tilt.sheenX}% 50%`,
              opacity: isHovered || showAnimated ? 0.9 : 0,
            }}
            className="pointer-events-none absolute inset-0 transition-opacity duration-500 z-10"
          />

          <div className="pointer-events-none absolute inset-0 bg-gradient-to-t from-[#0B0B0C] via-[#0B0B0C]/20 to-transparent z-10" />

          <span className="z-20 absolute top-3 left-3 px-3 py-1 rounded-md bg-[#0B0B0C]/85 backdrop-blur-md text-[#D4AF37] border border-[#D4AF37]/40 font-mono text-xs font-bold tracking-wider">
            {manga.kanjiMotif}
          </span>

          <div className="z-20 absolute top-3 right-3 flex items-center gap-1.5">
            <span className="px-2.5 py-1 rounded-md bg-[#0B0B0C]/85 backdrop-blur-md text-[#D4AF37] border border-[#D4AF37]/40 font-mono text-[10px] uppercase tracking-wider shadow-lg">
              SCÈNE ANIMÉE
            </span>
            {showAuthorBadge && (
              <span className="px-2.5 py-1 rounded-md bg-[#C85A32] text-[#F4F1EA] font-mono text-[10px] uppercase tracking-wider">
                {manga.author}
              </span>
            )}
          </div>

          <div className="z-20 absolute bottom-2.5 inset-x-3 flex flex-wrap items-center justify-between gap-2">
            <span
              className={`px-2.5 py-0.5 rounded font-mono text-[10px] uppercase tracking-wider border backdrop-blur-md transition-colors ${
                showAnimated
                  ? "bg-[#C85A32]/90 text-[#F4F1EA] border-[#D4AF37]/60"
                  : "bg-[#0B0B0C]/85 text-[#D4AF37] border-white/15"
              }`}
            >
              {showAnimated ? "EN ANIMATION • SCÈNE CULTE" : "POSTER ORIGINAL"}
            </span>

            <button
              type="button"
              onClick={(e) => {
                e.stopPropagation();
                setForcedMode((prev) =>
                  prev === "ANIMATED" ? "POSTER" : "ANIMATED"
                );
              }}
              className="px-2.5 py-1 rounded-md bg-[#0B0B0C]/90 hover:bg-[#D4AF37] hover:text-[#0B0B0C] text-[#F4F1EA] border border-[#D4AF37]/50 font-mono text-[10px] uppercase tracking-wider backdrop-blur-md transition-colors shadow-lg"
            >
              [AFFICHAGE : POSTER / ANIMÉ]
            </button>
          </div>
        </div>
      );
    }

                  e.currentTarget.src =
                    focusedItem.data.fallbackArtworkSvg ||
                    focusedItem.data.fallbackCoverSvg;
                }}
                alt=""
                aria-hidden="true"
                style={{
                  backgroundImage: `url(${focusedItem.data.artworkUrl || focusedItem.data.coverImage})`,
                }}
                className="fixed inset-0 bg-cover bg-center filter brightness-[0.45] contrast-[1.05] blur-[2px] scale-105 pointer-events-none transition-all duration-700 w-full h-full object-cover"
              />
              <div
                aria-hidden="true"
                style={{
                  background:
                    "radial-gradient(circle at center, transparent 0%, rgba(11, 11, 12, 0.40) 55%, rgba(11, 11, 12, 0.80) 100%)",
                }}
                className="fixed inset-0 bg-radial from-transparent via-[#0B0B0C]/40 to-[#0B0B0C]/80 pointer-events-none"
              />

              <div
                role="dialog"
                aria-modal="true"
                onClick={(e) => e.stopPropagation()}
                className="relative z-10 w-full max-w-5xl rounded-3xl bg-[#141417]/90 backdrop-blur-md border border-white/[0.15] shadow-2xl overflow-hidden my-auto transition-all duration-500 scale-100 opacity-100"
              >
                {/* Barre supérieure du Focus Éditorial */}
                <div className="px-6 sm:px-10 py-5 bg-[#0B0B0C]/90 border-b border-white/[0.08] flex flex-wrap items-center justify-between gap-4">
                  <div className="flex items-center gap-3">
                    <span className="w-2.5 h-2.5 rounded-full bg-[#C85A32] ring-4 ring-[#C85A32]/25" />
                    <span className="font-mono text-xs uppercase tracking-[0.2em] text-[#D4AF37]">
                      FOCUS ÉDITORIAL // DOSSIER COMPLET •{" "}
                      {focusedItem.type === "music" ? "LA SONOTHÈQUE" : "LE PANTHÉON MANGA"}
                    </span>
                  </div>

                  <div className="flex items-center gap-2">
                    <button
                      type="button"
                      onClick={() => navigateFocusedItem(-1)}
                      className="px-3.5 py-1.5 rounded-full bg-[#1E1E24] hover:bg-[#D4AF37] hover:text-[#0B0B0C] text-[#F4F1EA] font-mono text-xs uppercase tracking-wider border border-white/[0.1] transition-colors"
                    >
                      ← PRÉCÉDENT
                    </button>
                    <button
                      type="button"
                      onClick={() => navigateFocusedItem(1)}
                      className="px-3.5 py-1.5 rounded-full bg-[#1E1E24] hover:bg-[#D4AF37] hover:text-[#0B0B0C] text-[#F4F1EA] font-mono text-xs uppercase tracking-wider border border-white/[0.1] transition-colors"
                    >
                      SUIVANT →
                    </button>
                    <button
                      type="button"
                      onClick={() => setFocusedItem(null)}
                      className="ml-2 px-4 py-1.5 rounded-full bg-[#C85A32] hover:bg-[#D4AF37] hover:text-[#0B0B0C] text-[#F4F1EA] font-mono text-xs uppercase tracking-wider transition-colors shadow-lg"
                    >
                      FERMER [ÉCHAP]
                    </button>
                  </div>
                </div>

                {/* Contenu du Focus Musique */}
                {focusedItem.type === "music" && (
                  <div className="p-6 sm:p-10 space-y-8 max-h-[82vh] overflow-y-auto">
                    <div className="flex flex-col lg:flex-row items-center gap-8 sm:gap-12 pb-6 border-b border-white/[0.08]">
                      {/* Vinyle 3D géant */}
                      <div className="vinyl-stage relative w-52 h-52 sm:w-64 sm:h-64 shrink-0 mr-12 sm:mr-16 select-none">
                        <div className="vinyl-disc-3d absolute inset-y-2 right-0 w-48 h-48 sm:w-60 sm:h-60 rounded-full border border-white/20 shadow-2xl flex items-center justify-center vinyl-disc-idle">
                          <div
                            className="w-16 h-16 sm:w-20 sm:h-20 rounded-full border-4 border-[#0B0B0C] flex flex-col items-center justify-center text-center px-1"
                            style={{ backgroundColor: focusedItem.data.accentColor }}
                          >
                            <div className="w-3 h-3 rounded-full bg-[#0B0B0C] border border-white/30" />
                          </div>
                        </div>

                        <div className="vinyl-sleeve-3d relative z-10 w-full h-full rounded-2xl overflow-hidden border border-white/20 shadow-2xl bg-[#141417]">
                          <img
                            src={focusedItem.data.coverImage}
                            onError={(e) => {
                              e.currentTarget.src = focusedItem.data.fallbackCoverSvg;
                            }}
                            alt={`${focusedItem.data.artist} — ${focusedItem.data.title}`}
                            className="w-full h-full object-cover"
                          />
                        </div>
                      </div>

                      <div className="flex-1 min-w-0 text-left w-full">
                        <div className="flex flex-wrap items-center gap-2 mb-3">
                          <span className="px-3 py-1 rounded-full bg-[#1E1E24] text-[#D4AF37] border border-[#D4AF37]/30 font-mono text-xs uppercase tracking-wider">
                            {focusedItem.data.category} • {focusedItem.data.rpm}
                          </span>
                          <span className="px-3 py-1 rounded-full bg-[#0B0B0C] text-[#9E9EA9] border border-white/[0.08] font-mono text-xs">
                            ORIGINE : {focusedItem.data.origin}
                          </span>
                        </div>

                        <h2 className="font-serif text-4xl sm:text-5xl text-[#F4F1EA] leading-tight">
                          {focusedItem.data.artist}
                        </h2>
                        <div className="font-serif italic text-3xl sm:text-4xl text-[#D4AF37] mb-4">
                          {focusedItem.data.title}
                        </div>

                        <div className="p-3.5 rounded-xl bg-[#0B0B0C] border border-white/[0.08] mb-5">
                          <span className="font-mono text-[10px] uppercase tracking-widest text-[#C85A32] block mb-1">
                            ARCHITECTURE SONORE & DIRECTION DE PRODUCTION
                          </span>
                          <p className="font-mono text-xs text-[#F4F1EA]">
                            {focusedItem.data.productionNotes} — {focusedItem.data.audioDescription}
                          </p>
                        </div>

                        {/* LECTEUR OFFICIEL DEEZER DANS LE DOSSIER ÉTENDU */}
                        {focusedItem.data.deezerTrackId ? (
                          <div className="w-full mt-4 rounded-2xl overflow-hidden border border-[#D4AF37]/40 bg-black/70 shadow-2xl p-2.5 backdrop-blur-md">
                            <div className="flex items-center justify-between px-3 py-1.5 border-b border-white/10 mb-2">
                              <span className="text-[11px] font-mono tracking-wider text-[#D4AF37] flex items-center gap-2">
                                <span className="w-2 h-2 rounded-full bg-[#D4AF37] animate-pulse" />
                                ÉCOUTE OFFICIELLE DEEZER • EXTRAIT DISPONIBLE
                              </span>
                              <span className="text-[10px] font-mono text-white/50">
                                TITRE : « {focusedItem.data.previewTrackTitle} »
                              </span>
                            </div>
                            <iframe
                              title={`Deezer Player - ${focusedItem.data.title}`}
                              src={`https://widget.deezer.com/widget/dark/track/${focusedItem.data.deezerTrackId}?tracklist=false`}
                              width="100%"
                              height="152"
                              frameBorder="0"
                              allowtransparency="true"
                              allow="encrypted-media; clipboard-write"
                              className="rounded-xl w-full"
                            />
                          </div>
                        ) : (
                          <div className="p-4 rounded-xl bg-[#0B0B0C] border border-[#D4AF37]/30 text-center font-mono text-xs text-[#D4AF37]">
                            Lecteur Deezer en cours de synchronisation
                          </div>
                        )}
                      </div>
                    </div>

                    {/* Récit éditorial complet sur toute la largeur */}
                    <div className="space-y-5">
                      <div>
                        <span className="font-mono text-xs uppercase tracking-[0.18em] text-[#C85A32] block mb-2">
                          CHRONIQUE PERSONNELLE & MÉMOIRE D'ÉCOUTE
                        </span>
                        <p className="text-base sm:text-lg leading-relaxed text-[#DCDAD2] bg-[#0B0B0C]/80 p-6 rounded-2xl border border-white/[0.08]">
                          « {focusedItem.data.editorial} »
                        </p>
                      </div>

                      <div>
                        <span className="font-mono text-xs uppercase tracking-[0.18em] text-[#D4AF37] block mb-3">
                          TITRES EMBLÉMATIQUES DU DISQUE
                        </span>
                        <div className="flex flex-wrap gap-2">
                          {focusedItem.data.keyTracks.map((track) => (
                            <span
                              key={track}
                              className="px-3.5 py-1.5 rounded-xl bg-[#0B0B0C] border border-[#D4AF37]/35 font-mono text-xs text-[#F4F1EA]"
                            >
                              ♪ {track}
                            </span>
                          ))}
                        </div>
                      </div>
                    </div>
                  </div>
                )}

                {/* Contenu du Focus Manga */}
                {focusedItem.type === "manga" && (
                  <div className="p-6 sm:p-10 space-y-6 max-h-[82vh] overflow-y-auto">
                    {/* Sélecteur de Scènes pour Yu-Gi-Oh! */}
                    {focusedItem.data.bonusSceneGifUrl && (
                      <div className="flex flex-wrap items-center justify-between gap-2 p-2 rounded-2xl bg-[#0B0B0C]/90 border border-[#D4AF37]/30">
                        <span className="font-mono text-[10px] uppercase tracking-widest text-[#D4AF37] px-2">
                          SCÈNE CULTE EN ANIMATION :
                        </span>
                        <div className="flex flex-wrap items-center gap-2">
                          <button
                            type="button"
                            onClick={() => setActiveBonusSceneTab(1)}
                            className={`px-3 py-1.5 rounded-xl font-mono text-[11px] uppercase tracking-wider transition-all ${
                              activeBonusSceneTab === 1
                                ? "bg-[#D4AF37] text-[#0B0B0C] font-bold shadow-md"
                                : "bg-[#141417] text-[#F4F1EA] hover:border-[#D4AF37]/50 border border-white/10"
                            }`}
                          >
                            [1. SLIFER LE DRAGON CÉLESTE]
                          </button>
                          <button
                            type="button"
                            onClick={() => setActiveBonusSceneTab(2)}
                            className={`px-3 py-1.5 rounded-xl font-mono text-[11px] uppercase tracking-wider transition-all ${
                              activeBonusSceneTab === 2
                                ? "bg-[#C85A32] text-[#F4F1EA] font-bold shadow-md"
                                : "bg-[#141417] text-[#F4F1EA] hover:border-[#C85A32]/50 border border-white/10"
                            }`}
                          >
                            [2. LE SCEAU D'ORICHALQUE]
                          </button>
                          <button
                            type="button"
                            onClick={() => setActiveBonusSceneTab(0)}
                            className={`px-3 py-1.5 rounded-xl font-mono text-[11px] uppercase tracking-wider transition-all ${
                              activeBonusSceneTab === 0
                                ? "bg-[#F4F1EA] text-[#0B0B0C] font-bold shadow-md"
                                : "bg-[#141417] text-[#9E9EA9] hover:text-[#F4F1EA] border border-white/10"
                            }`}
                          >
                            [DIPTYQUE CÔTE À CÔTE]
                          </button>
                        </div>
                      </div>
                    )}

                    {focusedItem.data.bonusSceneGifUrl && activeBonusSceneTab === 0 ? (
                      <div className="grid grid-cols-1 md:grid-cols-2 gap-5 mb-2">
                        <div className="relative w-full rounded-2xl overflow-hidden border border-[#D4AF37]/30 bg-black/60 shadow-2xl flex items-center justify-center min-h-[240px] max-h-[380px]">
                          <img
                            src={focusedItem.data.animationGifUrl}
                            alt={`${focusedItem.data.title} — 1. Slifer le Dragon Céleste`}
                            className="w-full h-full max-h-[380px] object-contain sm:object-cover saturate-[1.18] contrast-[1.08]"
                            onError={(e) => {
                              e.currentTarget.src =
                                focusedItem.data.artworkUrl || focusedItem.data.fallbackArtworkSvg;
                            }}
                          />
                          <span className="absolute top-3 left-3 px-2.5 py-1 rounded-md bg-black/80 text-[#D4AF37] border border-[#D4AF37]/40 font-mono text-[10px] uppercase tracking-wider">
                            1. SLIFER LE DRAGON CÉLESTE
                          </span>
                          <span className="absolute top-3 right-3 px-2.5 py-1 rounded-full text-[10px] font-mono tracking-wider bg-black/75 text-[#D4AF37] border border-[#D4AF37]/40 backdrop-blur-md shadow-lg flex items-center gap-1.5">
                            <span className="w-1.5 h-1.5 rounded-full bg-[#D4AF37] animate-ping" />
                            SCÈNE ANIMÉE EN BOUCLE
                          </span>
                        </div>

                        <div className="relative w-full rounded-2xl overflow-hidden border border-[#C85A32]/50 bg-black/60 shadow-2xl flex items-center justify-center min-h-[240px] max-h-[380px]">
                          <img
                            src={focusedItem.data.bonusSceneGifUrl}
                            alt={`${focusedItem.data.title} — 2. Le Sceau d'Orichalque`}
                            className="w-full h-full max-h-[380px] object-contain sm:object-cover saturate-[1.18] contrast-[1.08]"
                            onError={(e) => {
                              e.currentTarget.src =
                                focusedItem.data.artworkUrl || focusedItem.data.fallbackArtworkSvg;
                            }}
                          />
                          <span className="absolute top-3 left-3 px-2.5 py-1 rounded-md bg-black/80 text-[#F4F1EA] border border-[#C85A32]/50 font-mono text-[10px] uppercase tracking-wider">
                            2. LE SCEAU D'ORICHALQUE
                          </span>
                          <span className="absolute top-3 right-3 px-2.5 py-1 rounded-full text-[10px] font-mono tracking-wider bg-black/75 text-[#D4AF37] border border-[#D4AF37]/40 backdrop-blur-md shadow-lg">
                            EN ANIMATION // BOUCLE CINÉMATIQUE
                          </span>
                        </div>
                      </div>
                    ) : (
                      <div className="relative w-full rounded-2xl overflow-hidden border border-[#D4AF37]/30 bg-black/60 shadow-2xl mb-6 flex items-center justify-center min-h-[260px] max-h-[420px] sm:max-h-[440px]">
                        <img
                          src={
                            focusedItem.data.bonusSceneGifUrl && activeBonusSceneTab === 2
                              ? focusedItem.data.bonusSceneGifUrl
                              : focusedItem.data.animationGifUrl
                          }
                          alt={`${focusedItem.data.title} Animation`}
                          className="w-full h-full max-h-[420px] sm:max-h-[440px] object-contain sm:object-cover saturate-[1.18] contrast-[1.08]"
                          onError={(e) => {
                            e.currentTarget.src =
                              focusedItem.data.artworkUrl || focusedItem.data.fallbackArtworkSvg;
                          }}
                        />
                        <div className="absolute inset-0 bg-gradient-to-t from-[#0B0B0C]/80 via-transparent to-transparent pointer-events-none" />

                        <div className="absolute top-3 left-3 flex items-center gap-2">
                          <span className="px-3 py-1 rounded-md bg-black/80 backdrop-blur-md text-[#D4AF37] border border-[#D4AF37]/40 font-mono text-xs font-bold tracking-wider">
                            {focusedItem.data.kanjiMotif}
                          </span>
                          <span className="hidden sm:inline-block px-2.5 py-1 rounded-md bg-[#C85A32]/90 text-[#F4F1EA] font-mono text-[10px] uppercase tracking-wider">
                            SCÈNE CULTE EN ANIMATION
                          </span>
                        </div>

                        <div className="absolute top-3 right-3 flex items-center gap-2">
                          <span className="px-2.5 py-1 rounded-full text-[10px] font-mono tracking-wider bg-black/75 text-[#D4AF37] border border-[#D4AF37]/40 backdrop-blur-md shadow-lg flex items-center gap-1.5">
                            <span className="w-1.5 h-1.5 rounded-full bg-[#D4AF37] animate-ping" />
                            SCÈNE ANIMÉE EN BOUCLE
                          </span>
                        </div>
                      </div>
                    )}

                    <div className="space-y-5">
                      <div className="flex flex-col gap-3 border-b border-white/[0.08] pb-5">
                        <div className="flex flex-wrap items-center gap-2.5">
                          <span className="px-3 py-1 rounded-md bg-[#0B0B0C] text-[#D4AF37] border border-[#D4AF37]/40 font-mono text-xs font-bold tracking-wider">
                            {focusedItem.data.kanjiMotif}
                          </span>
                          <span className="px-3 py-1 rounded-md bg-[#1E1E24] text-[#F4F1EA] border border-white/10 font-mono text-xs uppercase tracking-widest">
                            AUTEUR : {focusedItem.data.author}
                          </span>
                          <span className="px-3 py-1 rounded-md bg-[#0B0B0C] text-[#9E9EA9] border border-white/[0.08] font-mono text-xs uppercase tracking-wider">
                            {focusedItem.data.categoryLabel}
                          </span>
                        </div>

                        <div className="flex flex-wrap items-baseline justify-between gap-4">
                          <h2 className="font-serif text-4xl sm:text-5xl text-[#F4F1EA] leading-tight">
                            {focusedItem.data.title}
                          </h2>
                          <span className="px-3.5 py-1.5 rounded-lg bg-[#0B0B0C] border border-[#C85A32]/50 font-mono text-xs text-[#D4AF37]">
                            {focusedItem.data.sceneTitle}
                          </span>
                        </div>
                      </div>

                      <div>
                        <span className="font-mono text-xs uppercase tracking-[0.18em] text-[#C85A32] block mb-2">
                          RÉCIT PERSONNEL & ANALYSE DE LA SCÈNE CULTE
                        </span>
                        <p className="text-base sm:text-lg leading-relaxed text-[#DCDAD2] bg-[#0B0B0C]/80 p-6 rounded-2xl border border-white/[0.08]">
                          « {focusedItem.data.editorial} »
                        </p>
                      </div>

                      <div className="p-5 rounded-2xl bg-[#0B0B0C] border border-[#D4AF37]/30">
                        <span className="font-mono text-xs uppercase tracking-[0.18em] text-[#D4AF37] block mb-1.5">
                          THÈSE PHILOSOPHIQUE & NARRATIVE
                        </span>
                        <p className="font-serif italic text-xl sm:text-2xl text-[#F4F1EA]">
                          {focusedItem.data.philosophicalThesis}
                        </p>
                      </div>
                    </div>
                  </div>
                )}
              </div>
            </div>
          )}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
